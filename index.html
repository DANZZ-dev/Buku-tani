<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Buku Tani RP</title>
<style>
:root{--moss:#24462f;--moss2:#35653f;--moss3:#4c8a58;--wheat:#e5b53a;--soil:#4a3426;--paper:#f1f4ea;--card:#fff;--line:#d5dcc6;--red:#b4432f;--ink:#1c2a20;--ease:cubic-bezier(.22,.8,.3,1);--r:14px;--sh:0 1px 2px rgba(36,70,47,.08),0 4px 14px rgba(36,70,47,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
h1,h2,h3{font-family:"Rockwell","Roboto Slab",Georgia,serif;margin:0}
header{background:linear-gradient(135deg,var(--moss),var(--moss2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-radius:0 0 22px 22px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--wheat);border-radius:0 0 22px 22px;opacity:.9}
header::before{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:linear-gradient(rgba(36,70,47,.22),transparent);opacity:0;transition:opacity .25s;pointer-events:none}
header.sc::before{opacity:1}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:22px;animation:sway 4s ease-in-out infinite;transform-origin:50% 90%}
header h1{font-size:20px;line-height:1.15}
header small{opacity:.8;display:block;font-size:12px;font-family:system-ui}
#hdrInfo{font-size:11px;line-height:1.3;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:12px}
main{padding:16px 14px;max-width:560px;margin:0 auto}
#app>h2{font-size:22px;color:var(--moss);margin:2px 0 12px}

h3.sec{color:var(--moss)}

nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--soil);display:flex;z-index:6;border-radius:22px;box-shadow:0 8px 24px rgba(40,26,16,.35);max-width:536px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:#d9c9b8;padding:9px 1px 8px;font-size:10px;letter-spacing:-.2px;white-space:nowrap;position:relative;transition:color .2s;z-index:1}
nav button b{display:block;font-size:20px;line-height:1.15;transition:transform .3s var(--ease)}
nav button.on{color:#fff;font-weight:600}
nav button.on b{transform:translateY(-2px) scale(1.15)}
nav button:active b{transform:scale(.88)}
#navInd{position:absolute;top:0;left:0;width:20%;height:100%;transform:translateX(0);transition:transform .38s var(--ease);will-change:transform;pointer-events:none}
#navInd::before{content:"";position:absolute;inset:5px 6px;border-radius:17px;background:rgba(229,181,58,.22);box-shadow:inset 0 0 0 1px rgba(229,181,58,.35)}
nav .dot{position:absolute;top:4px;right:20%;background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:17px;padding:1px 4px;animation:pop .3s var(--ease)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--moss)}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fbfcf8;color:var(--ink);-webkit-user-select:text;user-select:text;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--moss2);background:#fff;box-shadow:0 0 0 3px rgba(229,181,58,.55)}
button:focus-visible{outline:3px solid var(--wheat);outline-offset:1px}
textarea{min-height:76px;resize:vertical}
pre{-webkit-user-select:text;user-select:text}
.row{display:flex;gap:10px}.row>*{flex:1}
button{touch-action:manipulation;font-family:inherit}
.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;background:linear-gradient(180deg,var(--moss2),var(--moss));color:#fff;width:100%;margin-top:12px;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(36,70,47,.25);transition:transform .15s var(--ease),opacity .2s,filter .2s,box-shadow .2s}
.btn::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.4),transparent 65%);opacity:0;pointer-events:none}
.btn:active::before{opacity:1}
.btn:not(:active)::before{transition:opacity .4s}
.btn:active{transform:scale(.97);box-shadow:0 1px 2px rgba(36,70,47,.25)}
.btn:disabled{opacity:.7;pointer-events:none}
.btn.alt{background:linear-gradient(180deg,#efc455,var(--wheat));color:var(--soil);box-shadow:0 2px 6px rgba(150,110,10,.25)}
.btn.ghost{background:transparent;color:var(--moss);border:1.5px solid var(--moss);box-shadow:none}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.red{background:linear-gradient(180deg,#c85a45,var(--red));box-shadow:0 2px 6px rgba(180,67,47,.25)}
.btn.load{color:transparent!important}
.btn.load::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.alt.load::after,.btn.ghost.load::after{border-color:rgba(74,52,38,.25);border-top-color:var(--soil)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--moss2);border-radius:var(--r);padding:12px 12px 12px 14px;margin-bottom:12px;box-shadow:var(--sh);transition:opacity .18s,transform .18s var(--ease)}
.card.out{opacity:0;transform:translateX(28px)}
.card.panen{border-left-color:var(--wheat)}
.card.due{border-left-color:var(--red);background:#fff4ef}
.card h3{font-size:16px}
.meta{font-size:12px;color:#5d6b5c}

.tag.warn{background:#fbe3d9;color:var(--red)}
.tag.ok{background:#d8efd9}
pre{white-space:pre-wrap;background:#f6f8f0;border:1px dashed var(--line);border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,Consolas,monospace;margin:8px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;color:#6b7a69;padding:34px 10px}
.empty::before{content:"🌱";display:block;font-size:44px;margin-bottom:6px;animation:float 3s ease-in-out infinite}
.seg{display:flex;gap:6px;margin-bottom:12px;background:#e3ecd6;padding:4px;border-radius:14px}
.seg button{flex:1;padding:9px 4px;border:0;background:transparent;border-radius:11px;font-size:14px;color:var(--moss);transition:background .25s,color .25s,transform .15s,box-shadow .25s}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--moss);color:#fff;box-shadow:0 2px 6px rgba(36,70,47,.3)}
.hint{font-size:12px;color:#5d6b5c;margin-top:4px}
.sec{margin-top:22px;margin-bottom:10px}
.pbar{display:flex;gap:8px}.pbar .btn{margin-top:6px}
.pstrip,.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ph{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;background:#e3ecd6;border:0;padding:0;animation:pop .28s var(--ease);transition:transform .15s}
button.ph:active{transform:scale(.94)}
.thumbs .ph{width:56px;height:56px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.ld{animation:pulse 1s ease-in-out infinite}
.ph .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:22px;padding:0}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
#viewer.show{opacity:1;visibility:visible}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;transform:scale(.94);transition:transform .3s var(--ease)}
#viewer.show img{transform:none}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,14px) scale(.96);background:var(--ink);color:#fff;padding:11px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .22s,transform .3s var(--ease);z-index:50;max-width:90%;text-align:center;will-change:transform,opacity;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#alarm{position:fixed;inset:0;background:rgba(36,70,47,.96);color:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#alarm.show{opacity:1;visibility:visible}
#alarm>*{transform:translateY(16px);transition:transform .35s var(--ease)}
#alarm.show>*{transform:none}
#alarm .bell{position:relative;font-size:56px;margin-bottom:12px;animation:ring 1.2s ease-in-out infinite;animation-play-state:paused}
#alarm .bell::before{content:"";position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid var(--wheat);opacity:0;animation:wave 1.6s ease-out infinite;animation-play-state:paused}
#alarm.show .bell,#alarm.show .bell::before{animation-play-state:running}
#alarm h2{font-size:26px;margin-bottom:8px}
#alarm .btn{max-width:320px}
#app.anim>*{animation:rise .38s var(--ease) both}
#app.anim>:nth-child(2){animation-delay:.04s}#app.anim>:nth-child(3){animation-delay:.08s}#app.anim>:nth-child(4){animation-delay:.12s}
#app.anim>:nth-child(5){animation-delay:.16s}#app.anim>:nth-child(6){animation-delay:.2s}#app.anim>:nth-child(7){animation-delay:.24s}#app.anim>:nth-child(n+8){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes wave{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes ring{0%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}60%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

#auth{position:fixed;inset:0;z-index:45;background:var(--paper);overflow:auto;display:none;padding:calc(28px + env(safe-area-inset-top)) 16px 28px;animation:rise .35s var(--ease) both}
#auth.show{display:block}
.authbox{max-width:420px;margin:0 auto;text-align:center}
.alogo{width:72px;height:72px;margin:0 auto 10px;border-radius:22px;background:linear-gradient(135deg,var(--moss),var(--moss2));display:grid;place-items:center;font-size:38px;animation:sway 4s ease-in-out infinite;transform-origin:50% 90%;box-shadow:var(--sh)}
.authbox h1{color:var(--moss);font-size:26px}
.authbox .panel{text-align:left;margin-top:4px}
#a_msg{min-height:18px;margin-top:10px;font-size:13px;color:var(--red);text-align:center}
#a_msg.good{color:var(--moss2)}
.tag.adm{background:#f6e3a8;color:var(--soil)}
.admn{font-size:12px;color:#5d6b5c;margin:2px 0 0}
.thr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.thr label{font-size:12.5px}
.tag.warn{background:#fbe3d6;color:#8a3b17}
.tag.wait{background:#f6e3a8;color:#6b4a0a}.pk{margin-top:8px;padding:9px 11px;border-radius:12px;background:#e8f1e2;color:#24462f;font-size:13.5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{display:inline-flex;align-items:center;gap:8px;background:#e8f1e2;border-radius:999px;padding:6px 6px 6px 12px;font-size:13.5px;font-weight:600;color:#24462f}.chip small{display:block;font-weight:400;opacity:.65;font-size:11px}.chip button{border:0;background:#c9d8bf;color:#24462f;border-radius:50%;width:26px;height:26px;font-size:12px;flex:none}.addrow{display:flex;gap:8px;align-items:stretch}.addrow input{flex:1;min-width:0}
</style>

<body>
<header><div class="brand"><span class="logo">🌾</span><div><h1>Buku Tani RP</h1><small id="clock"></small></div></div><div id="hdrInfo" class="meta" style="color:#fff;text-align:right"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="viewer" data-act="vclose"><img id="vImg" alt="Foto laporan"></div>
<div id="auth"></div>
<div id="alarm"><div class="bell">🔔</div><h2 id="alT"></h2><p id="alB"></p><button class="btn alt" id="alOk">Matikan</button><button class="btn ghost" id="alSn" style="color:#fff;border-color:#fff">Tunda 5 menit</button></div>

<script>
/* ---------- penyimpanan teks (localStorage, cadangan memori) ---------- */
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
};
/* ---------- penyimpanan foto (IndexedDB, supaya tidak penuhi localStorage) ---------- */
const DB={
  _p:null,_m:new Map(),
  open(){return this._p||(this._p=new Promise(res=>{try{const q=indexedDB.open('bukutani',1);q.onupgradeneeded=()=>q.result.createObjectStore('photos');q.onsuccess=()=>res(q.result);q.onerror=q.onblocked=()=>res(null)}catch(e){res(null)}}))},
  async run(mode,fn,fallback){
    const db=await this.open();if(!db)return fallback;
    return new Promise(r=>{try{const tx=db.transaction('photos',mode);const q=fn(tx.objectStore('photos'));tx.oncomplete=()=>r(q&&'result' in q?q.result:true);tx.onerror=tx.onabort=()=>r(fallback)}catch(e){r(fallback)}});
  },
  async put(id,v){if(!(await this.open())){this._m.set(id,v);return}await this.run('readwrite',s=>s.put(v,id),null)},
  async get(id){if(this._m.has(id))return this._m.get(id);return (await this.run('readonly',s=>s.get(id),null))||null},
  async del(id){this._m.delete(id);await this.run('readwrite',s=>s.delete(id),null)},
  async clear(){this._m.clear();await this.run('readwrite',s=>s.clear(),null)}
};

const DEF_TPL={
  benih:"# 🌱 ֹ  SEED HARVEST REPORT  ────────────\n\n**Request pengambilan seed**\n> 👤 Petani: {nama}\n> 📅 Tanggal/Waktu: {tanggal} {jam}\n> 📍 Lokasi Ladang: {lahan}\n> 📦 Jumlah Seed: {jumlah}\n> 📸 Bukti SS:\n\nNote : {catatan}\n\nTag : <@901003714154889258>\n\n───  Terima kasih telah melapor 🌱",
  panen:"**LAPORAN SETORAN HASIL PANEN**\nNama: {nama}\nHasil: {item}\nJumlah: {jumlah}\nLahan: {lahan}\nWaktu: {tanggal} {jam}\nCatatan: {catatan}"
};
let A=store.get('auth',null);
let S={
  logs:store.get('logs',[]),
  rem:store.get('rem',[]),
  tpl:store.get('tpl',DEF_TPL),
  cfg:store.get('cfg',{nama:'',sound:true}),
  tab:'benih',hist:'semua',histN:20
};
/* migrasi: format benih bawaan lama diganti format Seed Harvest Report */
if(S.tpl&&S.tpl.benih==="**LAPORAN PENGAMBILAN BENIH**\nNama: {nama}\nBenih: {item}\nJumlah: {jumlah}\nLahan: {lahan}\nWaktu: {tanggal} {jam}\nCatatan: {catatan}"){S.tpl.benih=DEF_TPL.benih;store.set('tpl',S.tpl)}
/* webhook & tag sekarang hanya ada di server: hapus sisa data lama di perangkat */
if(S.cfg&&('webhook' in S.cfg||'ping' in S.cfg)){delete S.cfg.webhook;delete S.cfg.ping;store.set('cfg',S.cfg)}
const MAXP=4;
const draft={benih:{photos:[],v:{},loading:0},panen:{photos:[],v:{},loading:0}};
const save=()=>{store.set('logs',S.logs);store.set('rem',S.rem);store.set('tpl',S.tpl);store.set('cfg',S.cfg)};
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const fmtD=t=>{const d=new Date(t);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const fmtT=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const toLocalInput=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)}
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>r()));
async function busy(b,fn){if(!b||b.disabled)return;b.disabled=true;b.classList.add('load');try{return await fn()}finally{b.disabled=false;b.classList.remove('load')}}

/* ---------- format laporan ---------- */
function render(tpl,d){
  const map={nama:d.nama||'-',item:d.item||'-',jumlah:d.jumlah||'-',lahan:d.lahan||'-',tanggal:fmtD(d.at),jam:fmtT(d.at),catatan:d.catatan||'-'};
  return tpl.replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m);
}
const msgOf=l=>render(S.tpl[l.type],l);

/* ---------- foto: kompres supaya cepat & ringan ---------- */
async function shrink(src,max,q){
  let bmp,tmp;
  try{bmp=await createImageBitmap(src,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=tmp=URL.createObjectURL(src)})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close)bmp.close();if(tmp)URL.revokeObjectURL(tmp);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  c.width=c.height=0;return blob;
}
function renderStrip(type){
  if(S.tab!==type)return;
  const el=$('#pStrip');if(!el)return;
  const d=draft[type];
  el.innerHTML=d.photos.map((p,i)=>`<div class="ph"><img src="${p.url}" alt="Foto ${i+1}"><button class="x" data-act="rmp" data-i="${i}" aria-label="Hapus foto">✕</button></div>`).join('')+'<div class="ph ld"></div>'.repeat(d.loading);
  const c=$('#pCount');if(c)c.textContent=`${d.photos.length}/${MAXP} foto`;
}
async function addPhotos(input){
  const type=S.tab,d=draft[type];
  const room=MAXP-d.photos.length-d.loading;
  const files=[...input.files].filter(f=>f.type.startsWith('image/')||!f.type).slice(0,Math.max(0,room));
  if(input.files.length>files.length)toast(`Maksimal ${MAXP} foto per laporan`);
  input.value='';
  d.loading+=files.length;renderStrip(type);
  for(const f of files){
    await nextFrame();
    try{
      const full=await shrink(f,1600,.82);
      const thumb=await shrink(full,240,.7);
      d.photos.push({full,thumb,url:URL.createObjectURL(thumb)});
    }catch(e){toast('Foto tidak dapat dibaca')}
    d.loading--;renderStrip(type);
  }
}
function clearDraft(type){draft[type].photos.forEach(p=>URL.revokeObjectURL(p.url));draft[type]={photos:[],v:{},loading:0}}

/* ---------- navigasi ---------- */
const TABS=[['benih','🌱','Benih'],['panen','🌾','Panen'],['riwayat','📒','Riwayat'],['ingat','⏰','Alarm'],['atur','⚙️','Pengaturan']];
const tabs=()=>A&&A.role==='admin'?[...TABS,['admin','👑','Admin']]:TABS;
let navBuilt=false,lastDue=-1,lastHdr='',admPending=0;
function drawNav(){
  const T=tabs();
  if(!navBuilt){
    $('#nav').innerHTML='<i id="navInd"></i>'+T.map(([k,i,n])=>`<button data-act="tab" data-t="${k}"><b>${i}</b>${n}</button>`).join('');
    $('#navInd').style.width=(100/T.length)+'%';
    navBuilt=true;lastDue=-1;
  }
  const idx=Math.max(0,T.findIndex(t=>t[0]===S.tab));
  $('#navInd').style.transform=`translateX(${idx*100}%)`;
  $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  const dots={ingat:S.rem.filter(r=>!r.done&&r.at<=Date.now()).length,admin:A&&A.role==='admin'?admPending:0},dk=JSON.stringify(dots);
  if(dk!==lastDue){
    lastDue=dk;$('#nav').querySelectorAll('.dot').forEach(e=>e.remove());
    for(const k in dots)if(dots[k]){const b=$(`#nav [data-t="${k}"]`);if(b)b.insertAdjacentHTML('beforeend',`<span class="dot">${dots[k]}</span>`)}
  }
  const unsent=S.logs.filter(l=>!l.sent).length;
  const waiting=S.logs.filter(l=>l.sent&&l.rid&&l.st!=='success').length;
  const hh=unsent?`${unsent} laporan<br>belum terkirim`:waiting?`${waiting} laporan<br>menunggu persetujuan`:'Semua laporan<br>terkirim';
  if(hh!==lastHdr){lastHdr=hh;$('#hdrInfo').innerHTML=hh}
}
let drawTok=0,thUrls=[];
function revokeTh(){thUrls.forEach(u=>URL.revokeObjectURL(u));thUrls=[]}
function draw(anim){
  drawTok++;revokeTh();drawNav();
  app.classList.remove('anim');
  ({benih:()=>drawForm('benih'),panen:()=>drawForm('panen'),riwayat:drawHist,ingat:drawRem,atur:drawSet,admin:openAdmin})[S.tab]();
  if(anim){void app.offsetWidth;app.classList.add('anim');clearTimeout(draw.h);draw.h=setTimeout(()=>app.classList.remove('anim'),750)}
}

async function commit(type){

  if(dr.loading){toast('Foto masih diproses, mohon tunggu sebentar');return null}
  const d=getForm(type),b=type==='benih';

  if(d.np)await DB.put(d.id,{full:dr.photos.map(p=>p.full),thumb:dr.photos.map(p=>p.thumb)});
  S.cfg.nama=d.nama;S.logs.unshift(d);

  }
  save();clearDraft(type);return d;
}

/* ---------- Discord & salin ---------- */
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}
}
async function sendDiscord(l){
  const text=msgOf(l);
  if(!A){toast('Silakan masuk terlebih dahulu');return false}
  try{
    const data={type:l.type,nama:l.nama,item:l.item,jumlah:l.jumlah,lahan:l.lahan,catatan:l.catatan,tanggal:fmtD(l.at),jam:fmtT(l.at)};
    const ph=l.np?await DB.get(l.id):null;
    let r;
    if(ph&&ph.full&&ph.full.length){
      const fd=new FormData();
      fd.append('data',JSON.stringify(data));
      ph.full.forEach((b,i)=>fd.append(`files[${i}]`,b,`foto-${i+1}.jpg`));
      r=await api('/api/report',{body:fd,web:true,timeout:90000});
    }else{
      r=await api('/api/report',{json:data,timeout:60000});
      if(l.np)toast('Foto tidak ditemukan; hanya teks laporan yang terkirim');
    }
    if(r.ok){l.sent=true;if(r.data.id){l.rid=r.data.id;l.st='pending'}save();if(!l.np||ph)toast(r.data.id?'Laporan terkirim. Menunggu persetujuan admin.':(ph?'Laporan dan foto berhasil terkirim':'Laporan berhasil terkirim'));if(r.data.id)setTimeout(memPoll,4000);return true}
    if(!A)return false;
    await copyText(text);
    toast((r.data.error||'Laporan gagal dikirim')+'. Teks laporan telah disalin'+(l.np?', namun foto tidak ikut tersalin.':'.'));
    return false;
  }catch(e){
    await copyText(text);
    toast(l.np?'Laporan gagal dikirim. Teks telah disalin; foto tidak ikut tersalin. Silakan kirim ulang dari Riwayat.':'Laporan gagal dikirim. Teks telah disalin; silakan kirim ulang dari Riwayat.');return false;
  }
}

async function loadThumbs(tok){
  for(const el of document.querySelectorAll('[data-th]')){
    const ph=await DB.get(el.dataset.th);
    if(tok!==drawTok)return;
    if(!ph||!ph.thumb){el.innerHTML='<span class="meta">Foto tidak ditemukan</span>';continue}
    el.innerHTML=ph.thumb.map((b,i)=>{const u=URL.createObjectURL(b);thUrls.push(u);return `<button class="ph" data-act="view" data-id="${el.dataset.th}" data-i="${i}" aria-label="Lihat foto ${i+1}"><img src="${u}" alt="Foto ${i+1}"></button>`}).join('');
  }
}
let vUrl=null;
async function openViewer(id,i){
  const ph=await DB.get(id);if(!ph||!ph.full||!ph.full[i]){toast('Foto tidak ditemukan');return}
  closeViewer(true);vUrl=URL.createObjectURL(ph.full[i]);
  $('#vImg').src=vUrl;$('#viewer').classList.add('show');
}
function closeViewer(now){
  const v=$('#viewer');v.classList.remove('show');
  const done=()=>{if(vUrl&&!v.classList.contains('show')){URL.revokeObjectURL(vUrl);vUrl=null;$('#vImg').removeAttribute('src')}};
  now?done():setTimeout(done,300);
}

/* ---------- alarm ---------- */
function drawRem(){
  const act=S.rem.filter(r=>!r.done).sort((a,b)=>a.at-b.at),done=S.rem.filter(r=>r.done).slice(-5).reverse();
  const perm='Notification' in window?Notification.permission:'tidak didukung',permTxt={granted:'diizinkan',denied:'ditolak',default:'belum diatur'}[perm]||perm;
  $('#app').innerHTML=`<h2>Alarm</h2>
  ${!native&&perm!=='granted'?`<div class="card"><b>Aktifkan notifikasi</b><div class="hint">Alarm berbunyi dan menampilkan layar peringatan saat aplikasi terbuka. Notifikasi sistem memerlukan izin (status: ${permTxt}).</div><div class="acts"><button class="btn sm" data-act="perm">Izinkan notifikasi</button></div></div>`:''}
  ${native?`<div class="card"><b>Alarm saat aplikasi ditutup</b><div class="hint">Alarm tetap berbunyi walaupun aplikasi ditutup. Android 12 ke atas dapat meminta izin alarm.</div><div class="acts"><button class="btn sm" data-act="exact">Aktifkan izin alarm</button></div></div>`:''}
  <div class="card"><h3>Tambah alarm</h3>
  <label>Nama alarm</label><input id="r_t" placeholder="Contoh: Setor hasil panen">
  <label>Waktu</label><input id="r_at" type="datetime-local" value="${toLocalInput(Date.now()+3600e3)}">
  <button class="btn" data-act="addrem">Tambah alarm</button></div>
  <h3 class="sec">Alarm aktif</h3>
  <div class="list">${act.length?act.map(r=>{const late=r.at<=Date.now();return `<div class="card ${late?'due':''}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(r.title)}</b><span class="tag ${late?'warn':''}" ${late?'':`data-cd="${r.at}"`}>${late?'Lewat waktu':cd(r.at)}</span></div><div class="meta">${fmtD(r.at)} ${fmtT(r.at)}</div><div class="acts"><button class="btn sm" data-act="rdone" data-id="${r.id}">Selesai</button><button class="btn sm ghost" data-act="rsn" data-id="${r.id}">+10 mnt</button><button class="btn sm red" data-act="rdel" data-id="${r.id}">Hapus</button></div></div>`}).join(''):`<div class="empty">Tidak ada alarm aktif.</div>`}</div>
  ${done.length?`<h3 class="sec">Alarm selesai</h3>`+done.map(r=>`<div class="card"><span class="meta">${fmtD(r.at)} ${fmtT(r.at)}</span> · ${esc(r.title)}</div>`).join(''):''}`;
}
function cd(t){const s=Math.max(0,Math.round((t-Date.now())/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d} hari ${h} jam`:h?`${h} jam ${m} mnt`:`${m} mnt ${s%60} dtk`}
/* hanya ubah teks hitung mundur, tanpa menggambar ulang seluruh halaman */
function updateCd(){
  for(const el of document.querySelectorAll('[data-cd]')){
    const at=+el.dataset.cd;
    if(at<=Date.now()){if(!document.activeElement.matches('input,textarea,select'))drawRem();return}
    const t=cd(at);if(el.textContent!==t)el.textContent=t;
  }
}

/* ---------- login & akun ---------- */
const API_DEFAULT='https://bukutani-api.dandipesek5.workers.dev'; /* alamat Worker */
const apiBase=()=>API_DEFAULT.replace(/\/+$/,'');
async function api(path,o={}){
  const hd={...(o.headers||{})};let body=o.body;
  if(A&&A.token)hd.Authorization='Bearer '+A.token;
  if(o.json!==undefined){hd['Content-Type']='application/json';body=JSON.stringify(o.json)}
  const F=o.web?(window.CapacitorWebFetch||window.fetch.bind(window)):window.fetch.bind(window);
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),o.timeout||30000);
  const had=!!(A&&A.token);
  try{
    const r=await F(apiBase()+path,{method:o.method||(body?'POST':'GET'),headers:hd,body,signal:ctl.signal});
    let j=null;try{j=await r.json()}catch(e){}
    j=j||{};
    if(had&&(r.status===401||(r.status===403&&j.code==='disabled')))doLogout(j.error||'Sesi berakhir, silakan masuk lagi');
    return {ok:r.ok,status:r.status,data:j};
  }catch(e){return {ok:false,status:0,data:{error:'Tidak dapat terhubung ke server. Periksa koneksi internet Anda.'}}}
  finally{clearTimeout(to)}
}

let admData=null;

let memBusy=false;
async function memPoll(){
  if(!A||memBusy||document.hidden)return;
  const now=Date.now(),ls=S.logs.filter(l=>l.rid&&l.sent&&(l.st!=='success'||(l.type==='benih'&&now-l.at<3*864e5))).slice(0,30);
  if(!ls.length)return;
  memBusy=true;
  try{
    const r=await api('/api/reports/status',{json:{ids:ls.map(l=>l.rid)}});
    if(!r.ok||!A)return;
    let ch=false;
    for(const l of ls){
      const it=r.data.items[l.rid];if(!it)continue;

  hist(b){S.hist=b.dataset.h;S.histN=20;drawTok++;revokeTh();drawNav();drawHist();app.classList.add('anim');clearTimeout(draw.h);draw.h=setTimeout(()=>app.classList.remove('anim'),750)},
  more(){S.histN+=20;const y=window.scrollY;drawTok++;revokeTh();drawHist();window.scrollTo(0,y)},
  send(b){return busy(b,async()=>{const l=findLog(b);if(!l)return;await sendDiscord(l);const y=window.scrollY;draw();window.scrollTo(0,y)})},
  async copy(b){const l=findLog(b);if(l){await copyText(msgOf(l));toast('Teks laporan disalin')}},
  del(b){const l=findLog(b);if(!l||!confirm('Hapus laporan ini?'))return;
    leave(b,()=>{S.logs=S.logs.filter(x=>x.id!==l.id);S.rem.filter(r=>r.logId===l.id).forEach(unschedule);S.rem=S.rem.filter(r=>r.logId!==l.id);DB.del(l.id);save();const y=window.scrollY;draw();window.scrollTo(0,y)})},
  view(b){openViewer(b.dataset.id,+b.dataset.i)},
  vclose(){closeViewer()},
  async exact(){try{await LN.requestPermissions();await LN.changeExactNotificationSetting()}catch(e){toast('Izin alarm sudah aktif')}},
  async perm(){try{await Notification.requestPermission()}catch(e){}drawRem()},
  addrem(){const t=$('#r_t').value.trim();if(!t){toast('Nama alarm wajib diisi');return}const nr={id:uid(),title:t,body:'',at:new Date($('#r_at').value).getTime(),done:false};S.rem.push(nr);schedule(nr);save();draw()},
  rdone(b){const r=findRem(b);if(!r)return;r.done=true;unschedule(r);save();leave(b,draw)},
  rsn(b){const r=findRem(b);if(!r)return;r.at=Date.now()+600e3;r.fired=false;schedule(r);save();draw()},
  rdel(b){const r=findRem(b);if(!r)return;unschedule(r);S.rem=S.rem.filter(x=>x.id!==r.id);save();leave(b,draw)},
  setsave(){S.cfg={...S.cfg,nama:$('#s_n').value.trim(),sound:$('#s_s').checked};save();toast('Pengaturan disimpan')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b,e)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id&&t.id.startsWith('f_')&&(S.tab==='benih'||S.tab==='panen')){if(t.id!=='f_at')draft[S.tab].v[t.id]=t.value;prevSoon()}
});
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('pin'))addPhotos(e.target)});

/* ---------- Android native (Capacitor) ---------- */
const CAP=window.Capacitor||{};
const LN=CAP.Plugins&&CAP.Plugins.LocalNotifications;
const native=!!(LN&&CAP.isNativePlatform&&CAP.isNativePlatform());
async function nativeInit(){
  if(!native)return;
  try{
    await LN.createChannel({id:'farmer',name:'Alarm Buku Tani',description:'Alarm panen dan pengambilan benih',importance:5,visibility:1,vibration:true,lights:true});
    const p=await LN.checkPermissions();
    if(p.display!=='granted')await LN.requestPermissions();
    for(const r of S.rem)if(!r.done&&r.at>Date.now())await schedule(r);
  }catch(e){}
  try{
    const A=CAP.Plugins.App;
    if(A)A.addListener('backButton',()=>{
      if(ringing){return}
      if($('#viewer').classList.contains('show')){closeViewer();return}
      if(S.tab!=='benih'){S.tab='benih';draw(true)}else A.exitApp();
    });
  }catch(e){}
}
async function schedule(r){
  if(!native||r.done)return;
  r.nid=r.nid||(Math.floor(Math.random()*2e9)+1);save();
  try{
    await LN.cancel({notifications:[{id:r.nid}]});
    if(r.at>Date.now())await LN.schedule({notifications:[{id:r.nid,title:r.title,body:r.body||'Sudah waktunya.',schedule:{at:new Date(r.at),allowWhileIdle:true},channelId:'farmer',autoCancel:true}]});
  }catch(e){}
}
async function unschedule(r){
  if(!native||!r.nid)return;
  try{await LN.cancel({notifications:[{id:r.nid}]})}catch(e){}
}

/* ---------- mesin pengingat ---------- */
let ringing=null,ac=null,lastClock='';
function beep(){
  if(native||!S.cfg.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    [0,.25,.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.2,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.22)});
  }catch(e){}
}
function ring(r){
  r.fired=true;save();
  $('#alT').textContent=r.title;$('#alB').textContent=r.body||`Dijadwalkan pukul ${fmtT(r.at)}`;
  $('#alarm').classList.add('show');ringing=r;
  beep();clearInterval(ring.h);ring.h=setInterval(beep,4000);
  if(!native&&navigator.vibrate)navigator.vibrate([300,150,300,150,300]);
  try{if(!native&&'Notification' in window&&Notification.permission==='granted')new Notification(r.title,{body:r.body||''})}catch(e){}
}
function stopRing(){$('#alarm').classList.remove('show');clearInterval(ring.h);ringing=null;draw()}
$('#alOk').onclick=()=>{if(ringing){ringing.done=true;unschedule(ringing)}save();stopRing()};
$('#alSn').onclick=()=>{if(ringing){ringing.at=Date.now()+300e3;ringing.fired=false;schedule(ringing)}save();stopRing()};
function tick(){
  const c=`${fmtD(Date.now())} · ${fmtT(Date.now())}`;
  if(c!==lastClock){lastClock=c;$('#clock').textContent=c}
  if(!ringing&&A){
    const r=S.rem.find(x=>x.id&&!x.done&&!x.fired&&x.at<=Date.now());
    if(r){ring(r);drawNav();return}
  }
  if(S.tab==='ingat'&&!ringing)updateCd();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
setInterval(()=>{if(!document.hidden)tick()},1000);

/* ---------- efek halus (ringan, pasif) ---------- */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect();b.style.setProperty('--rx',(e.clientX-r.left)+'px');b.style.setProperty('--ry',(e.clientY-r.top)+'px')},{passive:true});
(()=>{const h=document.querySelector('header');let q=0;addEventListener('scroll',()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;h.classList.toggle('sc',scrollY>4)})},{passive:true})})();
nativeInit();boot();
if(!native&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
